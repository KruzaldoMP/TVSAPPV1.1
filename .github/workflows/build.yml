name: Build Android APK

# Runs automatically whenever you push to main, and can also be triggered
# manually from the Actions tab in your GitHub repo ("Run workflow" button).
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build the APK with the official Buildozer Docker image
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}":/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest android debug

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvs-unit-tracker-apk
          path: bin/*.apk
